apiVersion: zeabur.com/v1
kind: Template
metadata:
  name: Ollama Cloud Proxy
spec:
  description: OpenAI-compatible Ollama Cloud key pool with a one-hour proxy cache ledger and token usage console.
  tags:
    - Tool
    - AI
  variables:
    - key: PUBLIC_DOMAIN
      type: DOMAIN
      name: Domain
      description: Public domain for the API and admin console.
  readme: |-
    # Ollama Cloud Proxy

    After deployment, open `/admin` and sign in with `ADMIN_PASSWORD` (default: `123456`).
    Add one or more Ollama Cloud keys, create a downstream client key, then use `/v1` as the OpenAI base URL.

    The `cached_tokens` value is generated by this proxy's one-hour cache ledger. It is not Ollama Cloud cache telemetry.
  services:
    - name: Ollama Cloud Proxy
      template: PREBUILT
      domainKey: PUBLIC_DOMAIN
      spec:
        source:
          image: ghcr.io/sta1n156/ollama-cloud-proxy:latest
        ports:
          - id: web
            port: 8080
            type: HTTP
        volumes:
          - id: data
            dir: /data
        env:
          PORT:
            default: "8080"
            readonly: true
          DATA_DIR:
            default: /data
            readonly: true
          ADMIN_PASSWORD:
            default: "123456"
          CACHE_TTL:
            default: 1h
          ALLOW_ANONYMOUS:
            default: "false"
          MAX_INFLIGHT_PER_KEY:
            default: "32"
        instructions:
          - type: DOMAIN
            title: Admin Console
            content: ${ZEABUR_WEB_URL}/admin
          - type: PASSWORD
            title: Default Admin Password
            content: ${ADMIN_PASSWORD}
            category: Credentials
  localization:
    zh-CN:
      description: 兼容 OpenAI 的 Ollama Cloud 密钥池，提供一小时转发层缓存账本和 Token 统计后台。
      variables:
        - key: PUBLIC_DOMAIN
          type: DOMAIN
          name: 访问域名
          description: API 与管理后台使用的公开域名。
      readme: |-
        # Ollama Cloud Proxy

        部署后访问 `/admin`，使用 `ADMIN_PASSWORD` 登录，默认值为 `123456`。
        添加 Ollama Cloud 密钥并生成下游访问密钥后，将 OpenAI Base URL 设置为站点的 `/v1`。

        `cached_tokens` 来自本代理的一小时缓存账本，不是 Ollama Cloud 返回的缓存数据。

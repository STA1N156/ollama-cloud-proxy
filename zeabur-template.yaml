apiVersion: zeabur.com/v1
kind: Template
metadata:
  name: Ollama Cloud Proxy
spec:
  description: OpenAI-compatible Ollama Cloud key pool with configurable prefix caching and a token usage console.
  tags:
    - Tool
    - AI
  variables:
    - key: PUBLIC_DOMAIN
      type: DOMAIN
      name: Domain
      description: Public domain for the API and admin console.
  readme: |-
    # Ollama Cloud Proxy

    After deployment, open `/admin` and sign in with `ADMIN_PASSWORD` (default: `123456`).
    Add one or more Ollama Cloud keys, create a downstream client key, then use `/v1` as the OpenAI base URL.

    Local prefix caching is enabled by default for 10 minutes. Change its duration or disable it in the cache page.
    Local `cached_tokens` are simulated and do not reduce upstream usage. Disabling local caching passes through official upstream usage.
  services:
    - name: Ollama Cloud Proxy
      template: PREBUILT
      domainKey: PUBLIC_DOMAIN
      spec:
        source:
          image: ghcr.io/sta1n156/ollama-cloud-proxy:latest
        ports:
          - id: web
            port: 8080
            type: HTTP
        volumes:
          - id: data
            dir: /data
        env:
          PORT:
            default: "8080"
            readonly: true
          DATA_DIR:
            default: /data
            readonly: true
          ADMIN_PASSWORD:
            default: "123456"
          ALLOW_ANONYMOUS:
            default: "false"
          MAX_INFLIGHT_PER_KEY:
            default: "32"
        instructions:
          - type: DOMAIN
            title: Admin Console
            content: ${ZEABUR_WEB_URL}/admin
          - type: PASSWORD
            title: Default Admin Password
            content: ${ADMIN_PASSWORD}
            category: Credentials
  localization:
    zh-CN:
      description: 兼容 OpenAI 的 Ollama Cloud 密钥池，提供可配置的基础前缀缓存和 Token 统计后台。
      variables:
        - key: PUBLIC_DOMAIN
          type: DOMAIN
          name: 访问域名
          description: API 与管理后台使用的公开域名。
      readme: |-
        # Ollama Cloud Proxy

        部署后访问 `/admin`，使用 `ADMIN_PASSWORD` 登录，默认值为 `123456`。
        添加 Ollama Cloud 密钥并生成下游访问密钥后，将 OpenAI Base URL 设置为站点的 `/v1`。

        本地前缀缓存默认开启，有效期 10 分钟，可在缓存页面修改时长或关闭。
        本地 `cached_tokens` 为模拟命中，不会减少上游实际用量；关闭后透传上游官方缓存用量。
